version: "3.9"

services:

  aegis-api:

    build:

      context: ..

      dockerfile: docker/Dockerfile

    container_name: aegis-api

    ports:

      - "8000:8000"

    env_file:

      - ../.env.example

    depends_on:

      - postgres

      - redis

  postgres:

    image: postgres:16

    container_name: aegis-postgres

    restart: always

    environment:

      POSTGRES_DB: aegis

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

  redis:

    image: redis:7

    container_name: aegis-redis

    restart: always

    ports:

      - "6379:6379"
